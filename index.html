<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chart Plotter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #071019;
    --panel: rgba(9, 20, 32, 0.9);
    --panel-border: #17324a;
    --hairline: rgba(111, 168, 208, 0.18);
    --ink: #d7ecff;
    --ink-dim: #6f92ab;
    --starboard: #35d07f;
    --port: #ff6a52;
    --amber: #ffb648;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--deep); }
  #map-wrap { position: absolute; top: 0; bottom: 0; width: 100%; overflow: hidden; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: linear-gradient(180deg, rgba(7,16,25,0.96) 0%, rgba(7,16,25,0.88) 100%);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(53, 208, 127, 0.15);
    backdrop-filter: blur(6px);
    padding: 9px 14px 8px 14px;
    box-sizing: border-box;
  }
  #hud-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #brand { display: flex; align-items: center; gap: 8px; }
  #brand-mark {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--starboard);
    position: relative;
    flex-shrink: 0;
  }
  #brand-mark::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 1px; height: 8px;
    background: var(--starboard);
    transform-origin: bottom center;
    transform: translate(-50%, -100%);
    animation: sweep 3.2s linear infinite;
    box-shadow: 0 0 4px var(--starboard);
  }
  @keyframes sweep { from { transform: translate(-50%, -100%) rotate(0deg); } to { transform: translate(-50%, -100%) rotate(360deg); } }
  #brand-text { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; }

  #status-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px 10px 4px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
  }
  #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--port); display: inline-block; transition: background 0.3s, box-shadow 0.3s; }
  #status-dot.live { background: var(--starboard); box-shadow: 0 0 6px var(--starboard); }

  #hud-readouts {
    display: flex;
    gap: 22px;
    margin-top: 9px;
  }
  .readout .r-label { color: var(--ink-dim); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 1px; }
  .readout .r-value { font-size: 17px; font-weight: 600; color: var(--ink); }
  .readout .r-value .unit { font-size: 10.5px; font-weight: 500; color: var(--ink-dim); margin-left: 2px; }

  #pos-line {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    opacity: 0.75;
  }

  #waypoint-bar {
    display: none;
    gap: 6px;
    margin-top: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  #waypoint-bar.show { display: flex; }
  .wp-chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 182, 72, 0.08);
    border: 1px solid rgba(255, 182, 72, 0.35);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--amber);
    white-space: nowrap;
  }
  .wp-chip .wp-label { font-weight: 700; opacity: 0.85; }
  .wp-chip .wp-remove { color: var(--ink-dim); cursor: pointer; font-family: 'Inter', sans-serif; padding-left: 2px; }

  #route-bar {
    display: none;
    gap: 6px;
    margin-top: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  #route-bar.show { display: flex; }
  .rt-chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(53, 208, 127, 0.08);
    border: 1px solid rgba(53, 208, 127, 0.35);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--starboard);
    white-space: nowrap;
  }
  .rt-chip .rt-label { font-weight: 700; opacity: 0.85; }
  .rt-chip .rt-remove { color: var(--ink-dim); cursor: pointer; font-family: 'Inter', sans-serif; padding-left: 2px; }
  .rt-chip.rt-total { background: rgba(255, 182, 72, 0.08); border-color: rgba(255, 182, 72, 0.35); color: var(--amber); }

  #routes-panel {
    display: none;
    position: absolute;
    bottom: 20px; left: 12px; right: 12px;
    max-width: 380px;
    z-index: 1100;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px;
    color: var(--ink);
    font-size: 12.5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    max-height: 60vh;
    overflow-y: auto;
    backdrop-filter: blur(6px);
  }
  #routes-panel.open { display: block; }
  #routes-panel-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  #routes-panel-close { background: none; border: none; color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .saved-route-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 4px;
    border-top: 1px solid var(--hairline);
  }
  .saved-route-row:first-child { border-top: none; }
  .saved-route-name { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
  .saved-route-actions { display: flex; gap: 6px; }
  .saved-route-actions button {
    background: rgba(255,255,255,0.04); color: var(--ink); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .saved-route-actions button.danger { color: var(--port); border-color: rgba(255,106,82,0.4); }
  #routes-empty { color: var(--ink-dim); font-size: 12px; padding: 4px; }

  #controls {
    position: absolute;
    bottom: 20px; right: 12px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #controls.collapsed {
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
  }
  #controls-min-btn {
    position: absolute;
    bottom: 20px; right: 12px;
    z-index: 1001;
    width: 34px; height: 34px;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #controls-min-btn.show { display: flex; }
  .ctrl-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    cursor: pointer;
    justify-content: flex-start;
  }
  .ctrl-btn .ico { font-size: 13px; line-height: 1; opacity: 0.9; }
  .ctrl-btn:active { background: #10263a; }
  .ctrl-btn.active { border-color: var(--starboard); color: var(--starboard); }

  #err-banner {
    position: absolute;
    top: 88px; left: 12px; right: 12px;
    z-index: 1000;
    background: rgba(255, 106, 82, 0.96);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    display: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }

  .leaflet-control-layers {
    background: var(--panel) !important;
    color: var(--ink) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 10px !important;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45) !important;
    backdrop-filter: blur(6px);
  }
  .leaflet-control-layers-toggle { filter: invert(0.9) hue-rotate(180deg); }
  .leaflet-control-layers-expanded { color: var(--ink) !important; font-size: 12.5px; }
  .leaflet-top.leaflet-right { top: 92px !important; }

</style>
</head>
<body>

<div id="hud">
  <div id="hud-top">
    <div id="brand">
      <div id="brand-mark"></div>
      <div id="brand-text">Chart Plotter</div>
    </div>
    <div id="status-pill"><span id="status-dot"></span><span id="status-text">Waiting</span></div>
  </div>
  <div id="hud-readouts">
    <div class="readout"><span class="r-label">Speed</span><span class="r-value mono" id="speed-text">&mdash;<span class="unit">kn</span></span></div>
    <div class="readout"><span class="r-label">COG</span><span class="r-value mono" id="cog-text">&mdash;<span class="unit">&deg;</span></span></div>
    <div class="readout"><span class="r-label">Mag Hdg</span><span class="r-value mono" id="heading-text">&mdash;<span class="unit">&deg;</span></span></div>
    <div class="readout"><span class="r-label">Accuracy</span><span class="r-value mono" id="acc-text">&mdash;<span class="unit">m</span></span></div>
  </div>
  <div id="pos-line" class="mono">Lat / Lon &mdash;</div>
  <div id="waypoint-bar"></div>
  <div id="route-bar"></div>
</div>

<div id="err-banner"></div>
<div id="map-wrap"><div id="map"></div></div>

<button id="controls-min-btn">&#8942;</button>
<div id="controls">
  <button class="ctrl-btn" id="controls-collapse-btn"><span class="ico">&#8944;</span>Minimize</button>
  <button class="ctrl-btn active" id="track-toggle"><span class="ico">&#9679;</span>Live Tracking</button>
  <button class="ctrl-btn" id="center-btn"><span class="ico">&#8982;</span>Find Ship</button>
  <button class="ctrl-btn" id="waypoint-btn"><span class="ico">&#9873;</span>Add Waypoint</button>
  <button class="ctrl-btn" id="route-btn"><span class="ico">&#8618;</span>Add Route</button>
  <button class="ctrl-btn" id="save-route-btn"><span class="ico">&#128190;</span>Save Route</button>
  <button class="ctrl-btn" id="routes-btn"><span class="ico">&#128193;</span>Routes</button>
  <button class="ctrl-btn" id="delete-route-btn"><span class="ico">&#10005;</span>Delete Route</button>
  <button class="ctrl-btn" id="clear-btn"><span class="ico">&#10005;</span>Clear Trail</button>
</div>

<div id="routes-panel">
  <div id="routes-panel-header">
    <span>Saved Routes</span>
    <button id="routes-panel-close">&times;</button>
  </div>
  <div id="routes-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/IvanSanchez/Leaflet.ImageOverlay.Rotated@gh-pages/Leaflet.ImageOverlay.Rotated.js"></script>
<script>
  const map = L.map('map', { zoomControl: false, attributionControl: true, maxZoom: 23 }).setView([37.8, -122.4], 12);

  const osmBase = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 23,
    maxNativeZoom: 19
  }).addTo(map);

  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 23,
    maxNativeZoom: 19
  });

  L.control.layers(
    { 'Street': osmBase, 'Satellite': esriSat },
    {},
    { position: 'topright' }
  ).addTo(map);

  // ---------- Hardwired chart photo overlay ----------
  // 1. Upload your chart photo to this same GitHub repo (same folder as index.html).
  // 2. Set CHART_IMAGE to its filename.
  // 3. Set the three corner coordinates below (top-left, top-right, bottom-left),
  //    read from the chart's own printed lat/lon tick marks.
  // 4. Set CHART_ENABLED to true.
  const CHART_ENABLED = true;
  const CHART_IMAGE = 'chart1.png';
  const CHART_TOPLEFT     = [44.29923, -64.38651];   // [lat, lon]
  const CHART_TOPRIGHT    = [44.29923, -64.24936];   // [lat, lon]
  const CHART_BOTTOMLEFT  = [44.21872, -64.38651];   // [lat, lon]
  const CHART_OPACITY = 1;

  if (CHART_ENABLED) {
    L.imageOverlay.rotated(
      CHART_IMAGE,
      L.latLng(CHART_TOPLEFT),
      L.latLng(CHART_TOPRIGHT),
      L.latLng(CHART_BOTTOMLEFT),
      { opacity: CHART_OPACITY, interactive: false }
    ).addTo(map);
    map.fitBounds(L.latLngBounds([CHART_TOPLEFT, CHART_TOPRIGHT, CHART_BOTTOMLEFT]));
  }

  // ---------- Small photo marker (house-scale) ----------
  // Placed as a simple square image overlay, sized to roughly a house
  // footprint (~15m x 15m) centered on the given coordinates.
  const PHOTO2_ENABLED = true;
  const PHOTO2_IMAGE = 'e412c3178725962ee0aeccee4992ec7d.jpeg';
  const PHOTO2_CENTER = [44.64706, -63.61644]; // [lat, lon]
  const PHOTO2_WIDTH_M = 6;   // approx half house-scale, portrait iPhone photo ratio (3:4)
  const PHOTO2_HEIGHT_M = 8;

  if (PHOTO2_ENABLED) {
    const latPerM = 1 / 111320;
    const lonPerM = 1 / (111320 * Math.cos(PHOTO2_CENTER[0] * Math.PI / 180));
    const halfLat = (PHOTO2_HEIGHT_M / 2) * latPerM;
    const halfLon = (PHOTO2_WIDTH_M / 2) * lonPerM;
    const photo2Bounds = [
      [PHOTO2_CENTER[0] - halfLat, PHOTO2_CENTER[1] - halfLon],
      [PHOTO2_CENTER[0] + halfLat, PHOTO2_CENTER[1] + halfLon]
    ];
    L.imageOverlay(PHOTO2_IMAGE, photo2Bounds, { interactive: false }).addTo(map);
  }

  // Vessel marker (rotates with heading)
  const boatIcon = L.divIcon({
    className: 'boat-icon',
    html: `<div id="boat-arrow" style="width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid #35d07f;filter:drop-shadow(0 0 3px rgba(0,0,0,0.6));transform-origin:50% 65%;"></div>`,
    iconSize: [18, 22],
    iconAnchor: [9, 14]
  });

  let marker = null;
  let accuracyCircle = null;
  let trail = L.polyline([], { color: '#35d07f', weight: 3, opacity: 0.8 }).addTo(map);
  let trailPoints = [];
  let watchId = null;
  let tracking = true;
  let firstFix = true;
  let lastHeading = 0;
  let lastCOG = null;
  let lastFixLatLng = null;

  function knots(mps) { return mps == null ? null : mps * 1.94384; }

  function setStatus(live, text) {
    document.getElementById('status-dot').classList.toggle('live', live);
    document.getElementById('status-text').textContent = text;
  }

  function showError(msg) {
    const el = document.getElementById('err-banner');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('err-banner').style.display = 'none';
  }

  function onPosition(pos) {
    hideError();
    const { latitude, longitude, accuracy, speed } = pos.coords;

    setStatus(true, 'Live');
    document.getElementById('pos-line').textContent = 'Lat / Lon ' + latitude.toFixed(5) + ', ' + longitude.toFixed(5);
    document.getElementById('acc-text').innerHTML = Math.round(accuracy) + '<span class="unit">m</span>';

    const kn = knots(speed);
    document.getElementById('speed-text').innerHTML = (kn != null && !isNaN(kn)) ? kn.toFixed(1) + '<span class="unit">kn</span>' : '&mdash;<span class="unit">kn</span>';

    const latlng = [latitude, longitude];

    if (!marker) {
      marker = L.marker(latlng, { icon: boatIcon }).addTo(map);
    } else {
      marker.setLatLng(latlng);
    }

    if (!accuracyCircle) {
      accuracyCircle = L.circle(latlng, { radius: accuracy, color: '#35d07f', weight: 1, fillOpacity: 0.08, opacity: 0.3 }).addTo(map);
    } else {
      accuracyCircle.setLatLng(latlng);
      accuracyCircle.setRadius(accuracy);
    }

    trailPoints.push(latlng);
    trail.setLatLngs(trailPoints);
    renderWaypointBar();
    renderRouteBar();

    // Course over ground: bearing between successive fixes. Ignored below
    // a small movement threshold to avoid GPS-noise jitter while stationary.
    if (lastFixLatLng) {
      const movedM = distanceNm(lastFixLatLng.lat, lastFixLatLng.lng, latitude, longitude) * 1852;
      if (movedM > 3) {
        lastCOG = bearingDeg(lastFixLatLng.lat, lastFixLatLng.lng, latitude, longitude);
        lastFixLatLng = { lat: latitude, lng: longitude };
        document.getElementById('cog-text').innerHTML = Math.round(lastCOG) + '<span class="unit">&deg;</span>';
      }
    } else {
      lastFixLatLng = { lat: latitude, lng: longitude };
    }

    if (firstFix) {
      map.setView(latlng, 16);
      firstFix = false;
    }
  }

  function onError(err) {
    setStatus(false, 'Error');
    let msg = 'Location error: ' + err.message;
    if (err.code === 1) msg = 'Location permission denied. Enable it in your browser/site settings.';
    if (err.code === 3) msg = 'Location request timed out. Retrying...';
    showError(msg);
  }

  function startTracking() {
    if (!('geolocation' in navigator)) {
      showError('Geolocation is not supported by this browser.');
      setStatus(false, 'Unsupported');
      return;
    }
    setStatus(false, 'Locating...');
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    });
    tracking = true;
  }

  function stopTracking() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    tracking = false;
    setStatus(false, 'Paused');
  }

  document.getElementById('track-toggle').addEventListener('click', function() {
    if (tracking) {
      stopTracking();
      this.classList.remove('active');
      this.innerHTML = '<span class="ico">&#9679;</span>Resume Tracking';
    } else {
      startTracking();
      this.classList.add('active');
      this.innerHTML = '<span class="ico">&#9679;</span>Live Tracking';
    }
  });

  document.getElementById('center-btn').addEventListener('click', function() {
    if (marker) map.setView(marker.getLatLng(), map.getZoom());
  });

  document.getElementById('clear-btn').addEventListener('click', function() {
    trailPoints = [];
    trail.setLatLngs([]);
  });

  // ---------- Minimize control stack ----------
  const controlsEl = document.getElementById('controls');
  const controlsMinBtn = document.getElementById('controls-min-btn');
  document.getElementById('controls-collapse-btn').addEventListener('click', () => {
    controlsEl.classList.add('collapsed');
    controlsMinBtn.classList.add('show');
  });
  controlsMinBtn.addEventListener('click', () => {
    controlsEl.classList.remove('collapsed');
    controlsMinBtn.classList.remove('show');
  });


  // ---------- Waypoints: course & distance from current position ----------
  const waypointIcon = L.divIcon({
    className: 'waypoint-icon',
    html: `<div style="width:14px;height:14px;background:#ffb648;border:2px solid #071019;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 14]
  });

  let waypoints = []; // { id, latlng, marker, label }
  let waypointCounter = 0;
  let waypointPicking = false;
  const waypointBtn = document.getElementById('waypoint-btn');
  const waypointBar = document.getElementById('waypoint-bar');

  function toRad(d) { return d * Math.PI / 180; }
  function toDeg(r) { return r * 180 / Math.PI; }

  // Local magnetic declination (variation), degrees, EAST POSITIVE / WEST NEGATIVE.
  // Set from NOAA/NRCan for your area — declination drifts slowly (well under
  // 1°/year in most places), so a value set once stays accurate a long time.
  // Default below is approx. for Nova Scotia (~16.1° W). Update if you cruise
  // somewhere else. Magnetic course = True course - Declination.
  const DECLINATION_DEG = -16.1;

  function trueToMagnetic(trueBearing) {
    return (trueBearing - DECLINATION_DEG + 360) % 360;
  }

  function distanceNm(lat1, lon1, lat2, lon2) {
    const R = 3440.065; // nautical miles
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingDeg(lat1, lon1, lat2, lon2) {
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function renderWaypointBar() {
    waypointBar.innerHTML = '';
    waypointBar.classList.toggle('show', waypoints.length > 0);
    waypoints.forEach(wp => {
      const chip = document.createElement('div');
      chip.className = 'wp-chip';
      let text = '&mdash; nm @ &mdash;&deg; M';
      if (marker) {
        const s = marker.getLatLng();
        const dist = distanceNm(s.lat, s.lng, wp.latlng.lat, wp.latlng.lng);
        const trueBrg = bearingDeg(s.lat, s.lng, wp.latlng.lat, wp.latlng.lng);
        const magBrg = trueToMagnetic(trueBrg);
        text = dist.toFixed(2) + ' nm @ ' + Math.round(magBrg) + '&deg; M';
      }
      chip.innerHTML = '<span class="wp-label">' + wp.label + '</span><span>' + text + '</span><span class="wp-remove" data-id="' + wp.id + '">&times;</span>';
      waypointBar.appendChild(chip);
    });
    waypointBar.querySelectorAll('.wp-remove').forEach(el => {
      el.addEventListener('click', () => removeWaypoint(Number(el.dataset.id)));
    });
  }

  function removeWaypoint(id) {
    const wp = waypoints.find(w => w.id === id);
    if (wp) map.removeLayer(wp.marker);
    waypoints = waypoints.filter(w => w.id !== id);
    renderWaypointBar();
  }

  function addWaypoint(latlng) {
    waypointCounter++;
    const id = Date.now();
    const label = 'WP' + waypointCounter;
    const m = L.marker(latlng, { icon: waypointIcon }).addTo(map);
    m.on('click', () => { if (confirm('Remove ' + label + '?')) removeWaypoint(id); });
    waypoints.push({ id, latlng, marker: m, label });
    renderWaypointBar();
  }

  waypointBtn.addEventListener('click', () => {
    if (routePicking) { routePicking = false; routeBtn.classList.remove('active'); routeBtn.innerHTML = '<span class="ico">&#8618;</span>Add Route'; }
    waypointPicking = !waypointPicking;
    waypointBtn.classList.toggle('active', waypointPicking);
    waypointBtn.innerHTML = waypointPicking
      ? '<span class="ico">&#9873;</span>Tap Map...'
      : '<span class="ico">&#9873;</span>Add Waypoint';
  });

  map.on('click', (e) => {
    if (!waypointPicking) return;
    addWaypoint(e.latlng);
    waypointPicking = false;
    waypointBtn.classList.remove('active');
    waypointBtn.innerHTML = '<span class="ico">&#9873;</span>Add Waypoint';
  });

  // ---------- Route: ordered points, connected leg by leg ----------
  const routeIcon = L.divIcon({
    className: 'route-icon',
    html: `<div style="width:12px;height:12px;background:#35d07f;border:2px solid #071019;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>`,
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });

  let routePoints = []; // { id, latlng, marker }
  let routeCounter = 0;
  let routePicking = false;
  const routeBtn = document.getElementById('route-btn');
  const routeBar = document.getElementById('route-bar');
  const routeLine = L.polyline([], { color: '#35d07f', weight: 2.5, opacity: 0.85, dashArray: '2 7' }).addTo(map);

  function renderRouteBar() {
    routeBar.innerHTML = '';
    routeBar.classList.toggle('show', routePoints.length > 0);

    // Leg 1: vessel -> first route point (if we have a ship fix)
    const legPoints = [];
    if (marker && routePoints.length > 0) legPoints.push(marker.getLatLng());
    routePoints.forEach(rp => legPoints.push(rp.latlng));
    routeLine.setLatLngs(legPoints);

    let totalNm = 0;
    let totalKnown = true;

    routePoints.forEach((rp, i) => {
      const from = i === 0 ? (marker ? marker.getLatLng() : null) : routePoints[i - 1].latlng;
      const fromLabel = i === 0 ? 'V' : routePoints[i - 1].label;
      let text = '&mdash; nm @ &mdash;&deg; M';
      if (from) {
        const dist = distanceNm(from.lat, from.lng, rp.latlng.lat, rp.latlng.lng);
        const trueBrg = bearingDeg(from.lat, from.lng, rp.latlng.lat, rp.latlng.lng);
        const magBrg = trueToMagnetic(trueBrg);
        text = dist.toFixed(2) + ' nm @ ' + Math.round(magBrg) + '&deg; M';
        totalNm += dist;
      } else {
        totalKnown = false;
      }
      const chip = document.createElement('div');
      chip.className = 'rt-chip';
      chip.innerHTML = '<span class="rt-label">' + fromLabel + '&rarr;' + rp.label + '</span><span>' + text + '</span><span class="rt-remove" data-id="' + rp.id + '">&times;</span>';
      routeBar.appendChild(chip);
    });

    if (routePoints.length > 0) {
      const totalChip = document.createElement('div');
      totalChip.className = 'rt-chip rt-total';
      totalChip.innerHTML = '<span class="rt-label">Total</span><span>' + (totalKnown ? totalNm.toFixed(2) + ' nm' : '&mdash; nm') + '</span>';
      routeBar.appendChild(totalChip);
    }

    routeBar.querySelectorAll('.rt-remove').forEach(el => {
      el.addEventListener('click', () => removeRoutePoint(Number(el.dataset.id)));
    });
  }

  function removeRoutePoint(id) {
    const rp = routePoints.find(r => r.id === id);
    if (rp) map.removeLayer(rp.marker);
    routePoints = routePoints.filter(r => r.id !== id);
    renderRouteBar();
  }

  function addRoutePoint(latlng) {
    routeCounter++;
    const id = Date.now() + Math.random();
    const label = 'R' + routeCounter;
    const m = L.marker(latlng, { icon: routeIcon }).addTo(map);
    m.on('click', () => { if (confirm('Remove ' + label + ' from route?')) removeRoutePoint(id); });
    routePoints.push({ id, latlng, marker: m, label });
    renderRouteBar();
  }

  routeBtn.addEventListener('click', () => {
    if (waypointPicking) { waypointPicking = false; waypointBtn.classList.remove('active'); waypointBtn.innerHTML = '<span class="ico">&#9873;</span>Add Waypoint'; }
    routePicking = !routePicking;
    routeBtn.classList.toggle('active', routePicking);
    routeBtn.innerHTML = routePicking
      ? '<span class="ico">&#8618;</span>Tap Map...'
      : '<span class="ico">&#8618;</span>Add Route';
  });

  map.on('click', (e) => {
    if (!routePicking) return;
    addRoutePoint(e.latlng);
  });

  // ---------- Delete active route (resets numbering back to R1) ----------
  function deleteActiveRoute() {
    routePoints.forEach(rp => map.removeLayer(rp.marker));
    routePoints = [];
    routeCounter = 0;
    routeLine.setLatLngs([]);
    renderRouteBar();
  }

  document.getElementById('delete-route-btn').addEventListener('click', () => {
    if (routePoints.length === 0) return;
    if (confirm('Delete the current route? This clears all route points.')) {
      deleteActiveRoute();
    }
  });

  // ---------- Save / load named routes (stored in this browser only) ----------
  const SAVED_ROUTES_KEY = 'chartPlotterSavedRoutes';

  function getSavedRoutes() {
    try {
      return JSON.parse(localStorage.getItem(SAVED_ROUTES_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function setSavedRoutes(routes) {
    try {
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(routes));
    } catch (e) {
      alert('Could not save route (browser storage unavailable).');
    }
  }

  document.getElementById('save-route-btn').addEventListener('click', () => {
    if (routePoints.length === 0) {
      alert('Add at least one route point before saving.');
      return;
    }
    const name = prompt('Name this route:', 'Route ' + (getSavedRoutes().length + 1));
    if (!name) return;
    const routes = getSavedRoutes();
    routes.push({
      name,
      savedAt: new Date().toISOString(),
      points: routePoints.map(rp => ({ lat: rp.latlng.lat, lon: rp.latlng.lng }))
    });
    setSavedRoutes(routes);
    renderRoutesList();
  });

  const routesPanel = document.getElementById('routes-panel');
  const routesList = document.getElementById('routes-list');

  function renderRoutesList() {
    const routes = getSavedRoutes();
    routesList.innerHTML = '';
    if (routes.length === 0) {
      routesList.innerHTML = '<div id="routes-empty">No saved routes yet.</div>';
      return;
    }
    routes.forEach((r, idx) => {
      const row = document.createElement('div');
      row.className = 'saved-route-row';
      row.innerHTML =
        '<span class="saved-route-name">' + r.name + ' <span style="color:var(--ink-dim)">(' + r.points.length + ' pts)</span></span>' +
        '<span class="saved-route-actions"><button data-action="load" data-idx="' + idx + '">Load</button>' +
        '<button data-action="delete" data-idx="' + idx + '" class="danger">Delete</button></span>';
      routesList.appendChild(row);
    });
    routesList.querySelectorAll('button[data-action="load"]').forEach(btn => {
      btn.addEventListener('click', () => loadSavedRoute(Number(btn.dataset.idx)));
    });
    routesList.querySelectorAll('button[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const routes = getSavedRoutes();
        if (confirm('Delete saved route "' + routes[Number(btn.dataset.idx)].name + '"?')) {
          routes.splice(Number(btn.dataset.idx), 1);
          setSavedRoutes(routes);
          renderRoutesList();
        }
      });
    });
  }

  function loadSavedRoute(idx) {
    const routes = getSavedRoutes();
    const r = routes[idx];
    if (!r) return;
    if (routePoints.length > 0 && !confirm('Replace the current route with "' + r.name + '"?')) return;
    deleteActiveRoute();
    r.points.forEach(p => addRoutePoint(L.latLng(p.lat, p.lon)));
    routesPanel.classList.remove('open');
  }

  document.getElementById('routes-btn').addEventListener('click', () => {
    renderRoutesList();
    routesPanel.classList.toggle('open');
  });
  document.getElementById('routes-panel-close').addEventListener('click', () => {
    routesPanel.classList.remove('open');
  });

  startTracking();


  // ---------- Magnetic compass heading ----------
  // iOS exposes webkitCompassHeading directly (already magnetic north).
  // Other browsers expose event.alpha via 'deviceorientationabsolute' (or
  // 'deviceorientation' with event.absolute === true); alpha counts
  // counter-clockwise from device's initial orientation, so we convert.
  function handleOrientation(event) {
    let heading = null;
    if (typeof event.webkitCompassHeading === 'number') {
      heading = event.webkitCompassHeading; // already magnetic, 0=N, clockwise
    } else if (event.alpha != null && (event.absolute === true || event.type === 'deviceorientationabsolute')) {
      heading = (360 - event.alpha) % 360;
    }
    if (heading == null || isNaN(heading)) return;
    lastHeading = heading;
    document.getElementById('heading-text').innerHTML = Math.round(heading) + '<span class="unit">&deg;</span>';
    const arrow = document.getElementById('boat-arrow');
    if (arrow) arrow.style.transform = 'rotate(' + heading + 'deg)';
  }

  function startCompass() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+: must be triggered by a user gesture.
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation, true);
        } else {
          showError('Compass access denied. Enable motion & orientation access in Settings > Safari.');
        }
      }).catch(() => {
        showError('Could not access the compass on this device.');
      });
    } else if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', handleOrientation, true);
    } else {
      showError('This browser does not support compass heading.');
    }
  }

  // iOS requires a user gesture to request sensor permission, so trigger
  // on first tap anywhere on the page.
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.body.addEventListener('click', startCompass, { once: true });
  } else {
    startCompass();
  }

</script>
</body>
</html>
